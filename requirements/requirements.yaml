# requirements/requirements.yaml (P27b-2, ADR 0044; design 8.1). The traceability list: one REQ-<area>-<nnn> per row of the design 8 test table, and the hazards H1 to H22 of design 7 mapped to REQ ids.
# A test file names a requirement with one `Requirements:` line: in the module docstring (Python), a header comment (TypeScript, C). P27b-3, ADR 0045. tools/check_requirements.py fails when an id in a test is not in this file, or when this file is malformed.
# status: Spec | Proposed | Decided, as the design words the statement. Every row of design 8 is Proposed (the heading of 8 says so); promoting one to Spec or Decided is a design-review decision, never made by code.
# source: the design 8 table row (docs/design/s08.md); title is the name the design gives the row. dtests: the D-tests the row names (design 7 and 8).
version: 1

areas:
  API: "REST, WebSocket and CSV interfaces"
  AUD: "Host and browser audio"
  DB: "Database, writer queue and migrations"
  FW: "Node firmware (pure C parts) and radio"
  ING: "Serial ingest, codec and sequence classes"
  ML: "Tier 2 model file"
  OPS: "Build, lock files and lint"
  REC: "Restart, recovery and start-up"
  RUL: "Rule engine, alerts and episodes"
  SEC: "Tokens, origins and operators"
  SES: "Sessions and End shift"
  UI: "Dashboard screens and browser tests"

