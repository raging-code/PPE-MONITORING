hazards:
  H1:
    title: "Silent node power loss"
    requirements: [REQ-RUL-006, REQ-RUL-003]
  H2:
    title: "Conscious-but-trapped wearer"
    requirements: [REQ-FW-002, REQ-RUL-002, REQ-RUL-006]
  H3:
    title: "False \"mated\" wrist sense"
    requirements: [REQ-RUL-007, REQ-UI-005]
  H4:
    title: "Stale SCBA-ON declaration"
    requirements: [REQ-FW-002, REQ-RUL-005, REQ-RUL-006]
  H5:
    title: "CO sensor out of range"
    requirements: [REQ-RUL-009, REQ-UI-005, REQ-RUL-006]
  H6:
    title: "Lost man-down latch"
    requirements: [REQ-FW-003, REQ-FW-004, REQ-RUL-012, REQ-REC-006]
  H7:
    title: "False ACK"
    requirements: [REQ-ING-003, REQ-ING-004, REQ-DB-002]
  H8:
    title: "Wrist-cable or sensor-head short"
    requirements: [REQ-UI-005, REQ-RUL-006]
  H9:
    title: "Battery thermal event"
    requirements: [REQ-RUL-003]
  H10:
    title: "Single-host failure"
    requirements: [REQ-UI-002, REQ-REC-001, REQ-REC-002, REQ-REC-005]
  H11:
    title: "Missed or silently acknowledged alert"
    requirements: [REQ-UI-003, REQ-API-003, REQ-AUD-001, REQ-RUL-002]
  H12:
    title: "Audio muted or suspended"
    requirements: [REQ-AUD-001, REQ-UI-002, REQ-AUD-005]
  H13:
    title: "Acknowledge mistaken for Resolve"
    requirements: [REQ-API-001, REQ-API-003, REQ-RUL-002, REQ-UI-003]
  H14:
    title: "3D view failure"
    requirements: [REQ-UI-006, REQ-ING-002]
  H15:
    title: "Cross-site call to the local API"
    requirements: [REQ-SEC-001]
  H16:
    title: "End shift pressed during an incident"
    requirements: [REQ-SES-002, REQ-SES-003, REQ-SES-004]
  H17:
    title: "Unsilenceable NO LIVE DATA siren leads to a muted laptop"
    requirements: [REQ-UI-009, REQ-AUD-002, REQ-AUD-001]
  H18:
    title: "False or hidden alerts after a host restart"
    requirements: [REQ-REC-001, REQ-REC-003, REQ-REC-004, REQ-REC-005, REQ-REC-008, REQ-REC-002]
  H19:
    title: "Logging fails without notice"
    requirements: [REQ-DB-002, REQ-DB-003, REQ-DB-004]
  H20:
    title: "Login failure or a disabled token blinds the commander"
    requirements: [REQ-SEC-005, REQ-SEC-004, REQ-SEC-003, REQ-SEC-002]
  H21:
    title: "Host machine sleeps, suspends or does not restart"
    requirements: [REQ-REC-007, REQ-AUD-003]
  H22:
    title: "Database corrupt or unreadable at start-up"
    requirements: [REQ-REC-007, REQ-DB-001]
