# P27-2 (ADR 0041): the CI of design 12.1 and 14.5. Every job runs on a clean checkout; nothing here needs a secret or a serial port.
#   host:      install from requirements-dev.lock (hashes), regenerate everything and fail if the working tree changed (a stale generated file or a new untracked one), design doc_lint, the core/ import rule, ruff, pytest, the frame and beacon vectors.
#   firmware:  the pure C parts built with gcc on the runner and run against frames.json and fw_scenarios.json (components/frame, rules_fw, nvs_latch).
#   dashboard: npm ci from package-lock.json, typecheck, Biome lint, Vitest, production build.
#   e2e:       P27-3 (ADR 0042): Playwright and Chromium against the built dashboard and the mock host of e2e/ (NO LIVE DATA at 4 s, Start monitoring unlocks audio); the report is kept when a test fails.
# Actions are pinned to a major tag; pin to a commit SHA before the trial if the repository is ever made public.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the dev tools from the hashed lock, then the host
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Generate everything
        run: |
          python tools/gen_abi.py
          python tools/gen_constants.py
          python tools/gen_frame_vectors.py
          python tools/gen_fw_vectors.py
          python tools/gen_ws_schema.py
          python tools/gen_sounds.py
      - name: Fail if the generators changed or added a file
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "A generated file is stale: run the generators (just gen) and commit the result."
            exit 1
          fi
      - name: Design document consistency
        run: python tools/doc_lint.py
      - name: Import rule (core/ imports nothing from io/, services/ or api/)
        run: python tools/check_imports.py
      - name: Lint (ruff, rules E9 and F)
        run: python -m ruff check host tools
      - name: pytest
        run: python -m pytest host/tests -q
      - name: Frame and beacon vectors
        run: python tools/test_vectors.py

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Firmware unit tests with gcc
        run: |
          gcc --version
          python tools/gen_frame_vectors.py
          python tools/gen_fw_vectors.py
          python tools/run_gcc_tests.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            e2e/package-lock.json
      - name: Install the dashboard
        run: npm ci
        working-directory: dashboard
      - name: Build the dashboard (the tests run against dashboard/dist)
        run: npm run build
        working-directory: dashboard
      - name: Install the browser tests
        run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser tests (NO LIVE DATA at 4 s, Start monitoring unlocks audio)
        run: npx playwright test
        working-directory: e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
